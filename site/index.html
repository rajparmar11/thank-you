<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Chelsi's Little Corner</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="world">
      <div class="grain"></div>
      <aside class="side">
        <button class="brand" data-view="home"><span>Chelsiiii</span><small>made by Raj</small></button>
        <nav id="sideNav"></nav>
      </aside>
      <section id="app" class="stage" aria-live="polite">
        <div class="loading">Opening the little corner...</div>
      </section>
      <nav id="bottomNav" class="bottom"></nav>
    </main>
    <form name="chelsi-submissions" method="POST" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="chelsi-submissions">
      <select name="kind"><option>note</option></select>
      <textarea name="message"></textarea>
      <input name="song">
      <input name="mood">
    </form>
    <script src="/app.js"></script>
  </body>
</html>
